name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unit + integration tests (Testcontainers uses the runner's Docker) + JaCoCo 80% rule
      - name: Build and tests (mvn verify)
        run: ./mvnw -B verify

      - name: Publish coverage report (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  dependency-check:
    name: Dependency scan (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: NVD database cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-

      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B -DskipTests org.owasp:dependency-check-maven:check

      - name: Publish Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*

  image-scan:
    name: Docker image build and scan (Trivy)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t oficina-mecanica:${{ github.sha }} .

      # Official Trivy image instead of trivy-action: its installer downloads from get.trivy.dev,
      # which failed to resolve on the runner (curl exit 6)
      - name: Trivy (full report)
        run: >
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$HOME/.cache/trivy:/root/.cache/trivy"
          -v "$PWD:/work" -w /work
          aquasec/trivy:0.70.0 image
          --format table --output trivy-report.txt
          --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --exit-code 0
          oficina-mecanica:${{ github.sha }}

      - name: Trivy (fail on CRITICAL with available fix)
        run: >
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$HOME/.cache/trivy:/root/.cache/trivy"
          aquasec/trivy:0.70.0 image
          --format table --severity CRITICAL --ignore-unfixed --exit-code 1
          oficina-mecanica:${{ github.sha }}

      - name: Publish Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
