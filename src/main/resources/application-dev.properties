# Local run: reads the variables from the .env file at the project root
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.flyway.locations=classpath:db/migration,classpath:db/seed

# Demo users: defaults only in this profile
app.seed.users.enabled=true
app.seed.users.admin.password=${DEMO_ADMIN_PASSWORD:admin123}
app.seed.users.attendant.password=${DEMO_ATTENDANT_PASSWORD:atendente123}

logging.level.br.com.oficina=DEBUG
