spring.application.name=workshop
# Without an explicit profile the application runs as "dev" (local, reading the .env file)
spring.profiles.default=dev

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT: the secret ALWAYS comes from an environment variable
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:PT2H}
app.jwt.issuer=oficina-mecanica

# Demo users (enabled per profile; password only via environment variable, except in dev)
app.seed.users.enabled=false
app.seed.users.admin.email=${DEMO_ADMIN_EMAIL:admin@oficina.com}
app.seed.users.admin.password=${DEMO_ADMIN_PASSWORD:}
app.seed.users.attendant.email=${DEMO_ATTENDANT_EMAIL:atendente@oficina.com}
app.seed.users.attendant.password=${DEMO_ATTENDANT_PASSWORD:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=Auto Repair Shop API

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-produces-media-type=application/json
