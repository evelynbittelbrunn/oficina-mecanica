# docker compose run: every variable comes from the container environment (.env)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.flyway.locations=classpath:db/migration,classpath:db/seed

# Demo users: passwords must come from environment variables
app.seed.users.enabled=true
