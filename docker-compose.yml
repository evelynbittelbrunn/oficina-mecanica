services:
  postgres:
    image: postgres:16
    container_name: workshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: oficina-mecanica:latest
    container_name: oficina-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-PT2H}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@oficina.com}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Set DEMO_ADMIN_PASSWORD in .env}
      DEMO_ATTENDANT_EMAIL: ${DEMO_ATTENDANT_EMAIL:-atendente@oficina.com}
      DEMO_ATTENDANT_PASSWORD: ${DEMO_ATTENDANT_PASSWORD:?Set DEMO_ATTENDANT_PASSWORD in .env}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  postgres_data:
